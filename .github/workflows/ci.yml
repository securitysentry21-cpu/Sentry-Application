# ARCH §19.3: runs on every pull request. A failing security check blocks the merge.
# `pnpm verify` is the same command developers run locally.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to a pull request replaces the older run. On main every commit runs to the end, so
# its image job is never cancelled and every green commit can be released (review L-23).
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name == 'push' && github.sha || 'pr' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    services:
      postgres:
        # Same major version as local development and RDS (Phase 0 decision).
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # Tests create their own databases and connect as app_runtime; this is only the admin URL.
      TEST_DATABASE_ADMIN_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v4.3.0; pnpm's version comes from "packageManager" in package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.16.0 # the server image's Node (infra/docker/Dockerfile)
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify

  # ADV-X08 (SEC §11, ARCH §19.3): the guard app's release manifest after Gradle has merged every
  # library's manifest into ours. It must declare the Play monitoring tool (EXT-20) and ask for exactly
  # the allow-listed permissions (apps/mobile/android-permissions.ts), so a library that quietly adds
  # one fails the build. Only here can it run: it needs the Android SDK, which GitHub's runner has.
  android-manifest:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.16.0 # the server image's Node (infra/docker/Dockerfile)
          cache: pnpm
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 17
      - run: pnpm install --frozen-lockfile
      - name: Generate the Android project (a staging build)
        working-directory: apps/mobile
        env:
          APP_VARIANT: staging
          EXPO_PUBLIC_API_BASE_URL: https://api.staging.invalid
          EXPO_NO_TELEMETRY: '1'
        run: pnpm exec expo prebuild --platform android --no-install
      - name: Fetch Gradle from its own GitHub release
        working-directory: apps/mobile/android
        # The wrapper asks services.gradle.org, which answered HTTP 504 to GitHub's runners on every
        # try (it works from elsewhere). The same file is published as a release asset of
        # github.com/gradle/gradle-distributions: ask for that, same version, in the generated project.
        run: |
          version=$(sed -n 's#.*/gradle-\(.*\)-bin\.zip#\1#p' gradle/wrapper/gradle-wrapper.properties)
          test -n "$version"
          sed -i "s#^distributionUrl=.*#distributionUrl=https://github.com/gradle/gradle-distributions/releases/download/v${version}/gradle-${version}-bin.zip#" gradle/wrapper/gradle-wrapper.properties
          grep distributionUrl gradle/wrapper/gradle-wrapper.properties
      - name: Merge the release manifest (Gradle)
        working-directory: apps/mobile/android
        # Gradle also downloads the Android libraries from public servers, which fail now and then.
        # Three attempts; a real failure fails all three.
        run: |
          chmod +x gradlew
          for attempt in 1 2 3; do
            if ./gradlew :app:processReleaseManifest --no-daemon --console=plain; then exit 0; fi
            echo "Gradle attempt $attempt failed"
            [ "$attempt" = 3 ] || sleep 30
          done
          exit 1
      - name: Check the merged manifest (ADV-X08)
        run: node apps/mobile/scripts/check-android-manifest.ts apps/mobile/android

  # ARCH §21.1: the dashboard's critical flows in a real browser, against a throwaway stack that
  # apps/web/e2e/stack.ts builds (PostgreSQL, API, worker, dashboard) and seeds: sign-in, an SOS from
  # alarm to resolution, a CSV export downloaded. Not yet a condition of the image job: it joins
  # `needs` there once it has proved steady on this runner.
  browser-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.16.0 # the server image's Node (infra/docker/Dockerfile)
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm --filter @sentryops/web exec playwright install --with-deps chromium
      - name: Browser tests
        run: pnpm e2e
      - name: Keep the traces of a failed run
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-results
          path: apps/web/test-results
          retention-days: 7

  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan the whole history for secrets (gitleaks)
        # A fixed release, by digest: a moved tag cannot change what runs over the history (review L-19).
        run: >-
          docker run --rm -v "$PWD:/repo"
          zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          detect --source /repo --redact --verbose

  # The cell's Terraform: formatted, valid, and planned against mocked providers by
  # infra/terraform/cell/tests/*.tftest.hcl, which assert what the cell must keep (the WAF never sees
  # an SOS, versioned photos, logs without values, the trusted proxies, production's required
  # settings). No AWS account and no credentials.
  terraform:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.16.5
          terraform_wrapper: false
      - run: bash infra/scripts/tf-test.sh

  # The server image (infra/docker/Dockerfile), built on Arm for Graviton, only for a commit on main
  # that passed every check above. AWS access is a short-lived role from GitHub's OIDC token that can
  # only push images (infra/terraform/cell/github.tf); no AWS key is stored in GitHub.
  # Deploying it is a separate, deliberate step: infra/scripts/release.sh <environment> <commit>.
  image:
    needs: [verify, android-manifest, secrets, terraform]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.AWS_IMAGES_ROLE_ARN != ''
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ vars.AWS_IMAGES_ROLE_ARN }}
          aws-region: eu-central-1
      - id: ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7
      - name: Build and push sentryops:${{ github.sha }}
        env:
          IMAGE: ${{ steps.ecr.outputs.registry }}/sentryops:${{ github.sha }}
        run: |
          docker build --platform linux/arm64 -f infra/docker/Dockerfile -t "$IMAGE" .
          docker push "$IMAGE"
