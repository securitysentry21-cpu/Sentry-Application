# ARCH §19.3: runs on every pull request. A failing security check blocks the merge.
# `pnpm verify` is the same command developers run locally.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    services:
      postgres:
        # Same major version as local development and RDS (Phase 0 decision).
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # Tests create their own databases and connect as app_runtime; this is only the admin URL.
      TEST_DATABASE_ADMIN_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version comes from "packageManager" in package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify

  # ADV-X08 (SEC §11, ARCH §19.3): the guard app's release manifest after Gradle has merged every
  # library's manifest into ours. It must declare the Play monitoring tool (EXT-20) and ask for exactly
  # the allow-listed permissions (apps/mobile/android-permissions.ts), so a library that quietly adds
  # one fails the build. Only here can it run: it needs the Android SDK, which GitHub's runner has.
  android-manifest:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: pnpm install --frozen-lockfile
      - name: Generate the Android project (a staging build)
        working-directory: apps/mobile
        env:
          APP_VARIANT: staging
          EXPO_PUBLIC_API_BASE_URL: https://api.staging.invalid
          EXPO_NO_TELEMETRY: '1'
        run: pnpm exec expo prebuild --platform android --no-install
      - name: Merge the release manifest (Gradle)
        working-directory: apps/mobile/android
        run: |
          chmod +x gradlew
          ./gradlew :app:processReleaseManifest --no-daemon --console=plain
      - name: Check the merged manifest (ADV-X08)
        run: node apps/mobile/scripts/check-android-manifest.ts apps/mobile/android

  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan the whole history for secrets (gitleaks)
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest detect --source /repo --redact --verbose

  # The server image (infra/docker/Dockerfile), built on Arm for Graviton, only for a commit on main
  # that passed every check above. AWS access is a short-lived role from GitHub's OIDC token that can
  # only push images (infra/terraform/production/github.tf); no AWS key is stored in GitHub.
  # Deploying it is a separate, deliberate step: infra/scripts/release.sh <commit>.
  image:
    needs: [verify, android-manifest, secrets]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.AWS_IMAGES_ROLE_ARN != ''
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_IMAGES_ROLE_ARN }}
          aws-region: eu-central-1
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build and push sentryops:${{ github.sha }}
        env:
          IMAGE: ${{ steps.ecr.outputs.registry }}/sentryops:${{ github.sha }}
        run: |
          docker build --platform linux/arm64 -f infra/docker/Dockerfile -t "$IMAGE" .
          docker push "$IMAGE"
