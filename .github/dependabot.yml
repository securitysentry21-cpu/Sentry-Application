# SEC §14: automated update pull requests.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  # Review L-19: the server image's base (infra/docker/Dockerfile) and the cell's providers.
  - package-ecosystem: docker
    directory: /infra/docker
    schedule:
      interval: weekly
  - package-ecosystem: terraform
    directory: /infra/terraform/cell
    schedule:
      interval: weekly
