packages:
  - apps/*
  - packages/*
  - tools/*

# pnpm blocks dependency install scripts unless listed here (supply-chain control, SEC §14).
# Each entry was read before allowing it.
allowBuilds:
  # postinstall only re-creates symlinks inside its own native/ folder from a bundled JSON list.
  '@embedded-postgres/windows-x64': true
  '@embedded-postgres/linux-x64': true
  # The same package for Arm Linux, where the server image is built (infra/docker/Dockerfile).
  '@embedded-postgres/linux-arm64': true

# React Native tooling expects a flat node_modules; see docs/DECISIONS.md (Phase 0 agent decisions).
nodeLinker: hoisted

# One React for the whole tree: the version React Native 0.86 ships with. Without this, Expo's
# web-rendering packages pull a newer react-dom that doesn't match react.
overrides:
  react: 19.2.3
  react-dom: 19.2.3
  # The Expo CLI still asks for node-forge 1.4.0, which has High advisories (GHSA-86w9-cpqp-85rv
  # and five more); 1.4.2 fixes them. Remove this once @expo/cli depends on >= 1.4.1 itself.
  node-forge: 1.4.2
  # Review L-20: fastify's schema compilers resolve fast-uri 3.1.8 and 4.2.1, which have moderate and
  # low advisories (GHSA-w74x-v6f9-j3xg, GHSA-wjr9-j795-jxcr, GHSA-xhq7-xmqj-769h, GHSA-333x-w4r6-6crp)
  # on the internet-facing API; 3.1.9 and 4.2.3 fix them, inside the ranges fastify asks for. Remove
  # these once a fresh install resolves those versions by itself.
  'fast-uri@^3.0.0': 3.1.9
  'fast-uri@^4.0.0': 4.2.3

# Never wait for an interactive 'purge node_modules?' prompt (installs run unattended).
confirmModulesPurge: false
